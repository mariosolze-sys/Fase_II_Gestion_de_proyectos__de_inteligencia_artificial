<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wisconsin | Demo de ML</title><style>body{font:16px system-ui;margin:0;background:#f3f6fa;color:#15243a}.wrap{max-width:990px;margin:32px auto;padding:0 18px}header{background:#172d50;color:white;padding:25px;border-radius:14px}h1{margin:0 0 8px}.small{color:#c9d7eb}main{background:white;margin-top:18px;border-radius:14px;padding:24px;box-shadow:0 6px 22px #12233b15}.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{font-size:13px;display:block;color:#344760}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #a9b9cd;border-radius:6px;margin-top:5px}button{margin-top:22px;background:#1557a6;color:white;padding:12px 20px;border:0;border-radius:8px;cursor:pointer}#result{white-space:pre-wrap;margin-top:18px;border-radius:8px;padding:14px;background:#eaf1fa}.warn{color:#7b3916}a{color:#1b6ed0}</style></head><body><div class="wrap"><header><h1>Clasificador Wisconsin</h1><div class="small">Frontend → API FastAPI → modelo scikit-learn</div></header><main><p class="warn"><strong>Solo demostración educativa.</strong> No constituye diagnóstico médico.</p><p>Los 30 valores de ejemplo se cargan automáticamente y pueden modificarse. <a href="/docs">Documentación Swagger API</a></p><form id="form"><div class="inputs" id="inputs"></div><button type="submit">Realizar predicción</button></form><div id="result" role="status" aria-live="polite">Cargando características...</div></main></div><script>let names=[];const container=document.getElementById('inputs'),out=document.getElementById('result');fetch('/api/model-info').then(r=>{if(!r.ok)throw Error('No se pudieron obtener los metadatos');return r.json()}).then(info=>{names=info.features;for(const [i,name] of names.entries()){const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='number';input.step='any';input.required=true;input.id='f'+i;input.value=info.sample[name];label.appendChild(input);container.appendChild(label)}out.textContent='Formulario listo. Modifica valores o utiliza el ejemplo.'}).catch(e=>out.textContent=e.message);document.getElementById('form').addEventListener('submit',async ev=>{ev.preventDefault();const features={};for(const [i,name] of names.entries())features[name]=Number(document.getElementById('f'+i).value);out.textContent='Procesando...';try{const r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({features})});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data.detail));out.textContent=`Predicción: ${data.label}\nProbabilidad estimada benigna: ${(data.probability_benign*100).toFixed(2)}%\nProbabilidad estimada maligna: ${(data.probability_malignant*100).toFixed(2)}%\n${data.disclaimer}`}catch(e){out.textContent='Error: '+e.message}})</script></body></html>
